; Sprechtaste für VoiceCommunication
; Standard: NodeMCU 1.0 (ESP8266). Optional: ESP32-S3-DevKitC-1 N16R8.
; Bauen/Flashen: pio run -e nodemcuv2 -t upload

[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
; Taster zwischen D5 (GPIO 14) und GND – bewusst kein Boot-Pin (D3/D4/D8)
build_flags =
    -DBUTTON_PIN=14

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
; N16R8: 16 MB Flash, 8 MB Octal-PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Serial = natives USB (Buchse "USB", VID 303A); Taster zwischen GPIO 4 und GND
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBUTTON_PIN=4
